name: Build APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk WallPanelLite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wallpanel-lite-apk
          path: WallPanelLite.apk
      # Tag vX.Y -> release normal, com o nome da tag e notas automáticas.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Pine3 Wallpanel ${{ github.ref_name }}
          generate_release_notes: true
          files: WallPanelLite.apk
      # Qualquer outro push -> atualiza a pre-release "latest" com o APK mais recente.
      - uses: softprops/action-gh-release@v2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          tag_name: latest
          name: Pine3 Wallpanel (último build)
          prerelease: true
          files: WallPanelLite.apk
          target_commitish: ${{ github.sha }}
